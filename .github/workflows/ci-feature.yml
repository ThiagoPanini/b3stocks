name: "⚙️ CI Feature Branch"

on:
  push:
    branches:
      - feature/**

permissions:
  id-token: write
  contents: write
  pull-requests: write
  actions: write

jobs:
  ci-python:
    name: 🐍 ci-python
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Python Setup
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: 📦 Dependencies Setup
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ./requirements.txt
      
      - name: 📏 Linter Analysis with Pylint
        run:
          pylint --rcfile=.pylintrc app

      - name: 🧪 Unit Test with Pytest
        run:
          python -m pytest -vv --color=yes --cov=./ --cov-report=xml

      - name: ☂️ Test Coverage with Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  ci-terraform:
    name: 🛠️ ci-terraform
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v4

      - name: ⛏️ Terraform Setup
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.10.5

      - name: ▶️ Terraform Init
        run: terraform init
        working-directory: infra

      - name: ⏏️ Terraform Validate
        run: terraform validate
        working-directory: infra

  open-pr-to-main:
    name: 🔓 open-pr-to-main
    runs-on: ubuntu-latest
    needs:
      - ci-python
      - ci-terraform

    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@v4

      - name: 🔓 PR to main
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: ${{ github.ref }}
          title: "pr(main): ${{ github.ref }} -> main"
          body-path: ".github/pull_request_template.md"
          labels: "github-bot 🤖"
          commit-message: "bot: automatic PR opening to main branch"
  